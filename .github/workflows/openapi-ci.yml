# Reusable OpenAPI CI: Spectral lint + oasdiff breaking-change check.
#
# The breaking-change baseline is, in order of preference:
#   1. the spec on the PR base branch (or at the commit before a push), or
#   2. the spec attached to the latest GitHub release (asset with the same file name).
# If neither exists, the job fails (it never skips): a green check must mean a real comparison.
#
# A breaking change passes only when marked: a `feat!:`/`fix!:` PR title (head commit on push)
# or a `BREAKING CHANGE:` footer in the PR body. The findings are still printed.
# Run the same comparison locally: see the contract repo's CLAUDE.md.
#
# Usage:
#   jobs:
#     openapi:
#       uses: weracerhq/.github/.github/workflows/openapi-ci.yml@main
#
# Runner (optional): defaults to GitHub-hosted ubuntu-latest. To pick another runner, pass a JSON value
# for `runs-on` (`runner: '["self-hosted","weracer"]'`). Use a custom runner only from private repos, never from public ones.
name: openapi-ci

on:
  workflow_call:
    inputs:
      spec:
        description: Path to the OpenAPI document.
        type: string
        default: openapi.yaml
      ruleset:
        description: Spectral ruleset file.
        type: string
        default: .spectral.yaml
      spectral-fail-severity:
        description: Spectral --fail-severity (error, warn, info, hint).
        type: string
        default: warn
      spectral-version:
        description: "@stoplight/spectral-cli version."
        type: string
        default: 6.17.0
      oasdiff-fail-on:
        description: oasdiff breaking --fail-on level (ERR or WARN).
        type: string
        default: ERR
      runner:
        description: JSON value for runs-on (a label string or a list of labels).
        type: string
        default: '"ubuntu-latest"'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-openapi-ci
  cancel-in-progress: true

env:
  OASDIFF_VERSION: 1.34.0
  OASDIFF_SHA256: 7c88e09fd500b231af2819eb21f6fdfc7bcdfe2741d2c1937c59e7b72c8a575a

jobs:
  lint:
    name: spectral
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Self-hosted runners may not ship Node; GitHub-hosted ones already do.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Spectral lint
        env:
          SPEC: ${{ inputs.spec }}
          RULESET: ${{ inputs.ruleset }}
          FAIL_SEVERITY: ${{ inputs.spectral-fail-severity }}
          SPECTRAL_VERSION: ${{ inputs.spectral-version }}
        run: |
          npx --yes "@stoplight/spectral-cli@${SPECTRAL_VERSION}" lint "$SPEC" \
            --ruleset "$RULESET" \
            --fail-severity "$FAIL_SEVERITY" \
            --format github-actions

  breaking:
    name: oasdiff breaking
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch baseline spec
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          SPEC: ${{ inputs.spec }}
          BASE_REF: ${{ github.base_ref || 'main' }}
          EVENT: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -u
          if ! command -v gh >/dev/null; then
            echo "::error title=oasdiff baseline::The gh CLI is not installed on this runner, so the baseline cannot be fetched."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/base"
          name="$(basename "$SPEC")"
          base="$RUNNER_TEMP/base/$name"
          err="$RUNNER_TEMP/base/err.txt"
          # Compare what this change alters: the PR base branch, or the commit before a push.
          # Comparing with the last release would re-flag an already merged, marked breaking
          # change on every later PR until the next release.
          ref="$BASE_REF"
          [ "$EVENT" = "pull_request" ] || ref="$BEFORE_SHA"
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>"$err" || true)"
          if [ -n "$ref" ] && [ "${ref//0/}" != "" ] \
             && gh api -H "Accept: application/vnd.github.raw" \
                  "repos/$GITHUB_REPOSITORY/contents/$SPEC?ref=$ref" > "$base" 2>>"$err" \
             && [ -s "$base" ]; then
            echo "Baseline: $SPEC at $ref"
            echo "source=$ref" >> "$GITHUB_OUTPUT"
          elif [ -n "$tag" ] && gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
               --pattern "$name" --dir "$RUNNER_TEMP/base" --clobber 2>>"$err"; then
            echo "Baseline: $SPEC from release $tag"
            echo "source=release $tag" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=oasdiff baseline missing::No previous version of $SPEC (not at $ref, no release asset named $name). The check fails instead of skipping; fix the error below."
            cat "$err" >&2
            exit 1
          fi
          echo "path=$base" >> "$GITHUB_OUTPUT"

      - name: Install oasdiff
        run: |
          cd "$RUNNER_TEMP"
          f="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$f" "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/${f}"
          echo "${OASDIFF_SHA256}  ${f}" | sha256sum --check --strict
          tar -xzf "$f" oasdiff
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Breaking-change check
        env:
          BASE: ${{ steps.base.outputs.path }}
          SOURCE: ${{ steps.base.outputs.source }}
          SPEC: ${{ inputs.spec }}
          FAIL_ON: ${{ inputs.oasdiff-fail-on }}
          # Untrusted text: only ever read as data from the environment, never interpolated into the script.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          echo "Comparing $SPEC against $SOURCE"
          oasdiff changelog "$BASE" "$SPEC" | tee -a "$GITHUB_STEP_SUMMARY"
          rc=0
          oasdiff breaking "$BASE" "$SPEC" --format githubactions --fail-on "$FAIL_ON" || rc=$?
          [ "$rc" -eq 0 ] && exit 0
          # A reviewed breaking change is allowed through when it is marked: a `type!:` title
          # (PR title on pull_request, head commit on push) or a `BREAKING CHANGE:` footer.
          first="${PR_TITLE:-${COMMIT_MSG%%$'\n'*}}"
          text="${PR_BODY:-}"$'\n'"${COMMIT_MSG:-}"
          if printf '%s' "$first" | grep -Eq '^[a-zA-Z]+(\([^)]*\))?!:' \
             || printf '%s' "$text" | grep -Eq '^BREAKING[ -]CHANGE: '; then
            echo "::warning title=oasdiff breaking::Breaking changes found, allowed because the change is marked as breaking (type!: or BREAKING CHANGE footer)."
            exit 0
          fi
          echo "::error title=oasdiff breaking::Unmarked breaking change. Mark it with a 'feat!:'/'fix!:' title or a 'BREAKING CHANGE:' footer in the PR body, then re-run the job (a title edit does not re-trigger it)."
          exit "$rc"
