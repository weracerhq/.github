# Reusable Gradle / Kotlin Multiplatform CI: JDK + Gradle cache, `./gradlew check`.
# Skips cleanly (job passes with a notice) while the repo has no `gradlew` yet.
#
# Usage:
#   jobs:
#     gradle:
#       uses: weracerhq/.github/.github/workflows/gradle-ci.yml@main
#       with:
#         extra-tasks: ":androidApp:assembleDebug"
#
# Runner (optional): defaults to GitHub-hosted ubuntu-latest. To pick another runner,
# pass a JSON value for `runs-on`, e.g. a label list:
#       with:
#         runner: '["self-hosted","weracer"]'
# Use a custom runner only from private repos, never from public ones.
name: gradle-ci

on:
  workflow_call:
    inputs:
      java-version:
        description: JDK version (Temurin).
        type: string
        default: "17"
      working-directory:
        description: Directory containing `gradlew`.
        type: string
        default: .
      extra-tasks:
        description: Extra Gradle tasks/arguments appended after `check`.
        type: string
        default: ""
      runner:
        description: JSON value for runs-on (a label string or a list of labels).
        type: string
        default: '"ubuntu-latest"'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-gradle-ci
  cancel-in-progress: true

jobs:
  check:
    name: gradle check
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect Gradle project
        id: detect
        env:
          WORKDIR: ${{ inputs.working-directory }}
        run: |
          if [ -f gradlew ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=gradle-ci skipped::No gradlew in '${WORKDIR}' yet; nothing to build."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: steps.detect.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: steps.detect.outputs.present == 'true'
        with:
          # "basic" = plain actions/cache, free for private repos (the default
          # "enhanced" provider is only a free preview for private repos).
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: ./gradlew check
        if: steps.detect.outputs.present == 'true'
        env:
          EXTRA_TASKS: ${{ inputs.extra-tasks }}
        run: |
          # EXTRA_TASKS is intentionally unquoted so it splits into separate tasks.
          # shellcheck disable=SC2086
          ./gradlew check ${EXTRA_TASKS} --continue --stacktrace
